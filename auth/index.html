      // HSP "link that just works": an approval link opens the shop with ?hsp=<token>.
      // Stash the token AS-IS (tokens are case-sensitive), strip it from the URL, then show
      // a persistent bar so the customer knows their subsidy is active while they browse.
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var t = (p.get('hsp') || '').trim();
          var oc = (p.get('offer') || '').trim().toUpperCase();
          if (oc && /^[A-Z0-9-]{6,40}$/.test(oc)) { localStorage.setItem('th_offer', oc); p.delete('offer'); }
          if (t || oc) {
            if (t) localStorage.setItem('th_hsp', t);
            p.delete('hsp');
            var qs = p.toString();
            history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
          }
        } catch (_) {}
        try {
          // Only reassure on shopping pages (where HSP pricing is shown), not the immersive
          // audiogram test, home, about, etc.
          var pth = location.pathname;
          var onShop = pth.indexOf('/hearing-aids') === 0 || pth.indexOf('/cart') === 0;
          if (onShop && (localStorage.getItem('th_hsp') || '').trim() && !document.getElementById('thHspBar')) {
            var bar = document.createElement('div');
            bar.id = 'thHspBar';
            bar.setAttribute('role', 'status');
            bar.style.cssText = 'background:#E8F1EE;color:#224F52;border-bottom:1px solid #CFE3E3;font-family:var(--font-sans,system-ui,sans-serif);font-size:.85rem;font-weight:600;line-height:1.35;text-align:center;padding:9px 16px;';
            bar.innerHTML = (localStorage.getItem('th_offer') || '').trim()
              ? '✓ Your Hearing Services Program subsidy and your audiogram discount ($250 off each hearing aid) are active. Both apply automatically at checkout.'
              : '✓ Your Hearing Services Program subsidy is active. We apply it automatically at checkout.';
            document.body.insertBefore(bar, document.body.firstChild);
          }
          if (onShop && !(localStorage.getItem('th_hsp') || '').trim() && (localStorage.getItem('th_offer') || '').trim() && !document.getElementById('thHspBar')) {
            var ob = document.createElement('div');
            ob.id = 'thHspBar';
            ob.setAttribute('role', 'status');
            ob.style.cssText = 'background:#E8F1EE;color:#224F52;border-bottom:1px solid #CFE3E3;font-family:var(--font-sans,system-ui,sans-serif);font-size:.85rem;font-weight:600;line-height:1.35;text-align:center;padding:9px 16px;';
            ob.textContent = '✓ Your audiogram discount is active: $250 off each hearing aid, $500 off a pair. It applies automatically at checkout.';
            document.body.insertBefore(ob, document.body.firstChild);
          }
        } catch (_) {}
      })();

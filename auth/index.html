      // HSP "link that just works": an approval link opens the shop with ?hsp=<token>.
      // Stash the token AS-IS (tokens are case-sensitive), strip it from the URL, then show
      // a persistent bar so the customer knows their subsidy is active while they browse.
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var t = (p.get('hsp') || '').trim();
          if (t) {
            localStorage.setItem('th_hsp', t);
            p.delete('hsp');
            var qs = p.toString();
            history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
          }
        } catch (_) {}
        try {
          // Only reassure on shopping pages (where HSP pricing is shown), not the immersive
          // audiogram test, home, about, etc.
          var pth = location.pathname;
          var onShop = pth.indexOf('/hearing-aids') === 0 || pth.indexOf('/cart') === 0;
          if (onShop && (localStorage.getItem('th_hsp') || '').trim() && !document.getElementById('thHspBar')) {
            var bar = document.createElement('div');
            bar.id = 'thHspBar';
            bar.setAttribute('role', 'status');
            bar.style.cssText = 'background:#E8F1EE;color:#224F52;border-bottom:1px solid #CFE3E3;font-family:var(--font-sans,system-ui,sans-serif);font-size:.85rem;font-weight:600;line-height:1.35;text-align:center;padding:9px 16px;';
            bar.innerHTML = '✓ Your Hearing Services Program subsidy is active. We apply it automatically at checkout, and you can add a $500 audiogram code on the payment page.';
            document.body.insertBefore(bar, document.body.firstChild);
          }
        } catch (_) {}
      })();

</style></head> <body> <a class="skip" href="#main">Skip to content</a>   <main class="authp"> <a href="/" class="authp-brand" aria-label="TellyHear home"> <img class="brand-logo" src="/logos/TellyHear Logo.webp" alt=""> <span class="brand-name">Telly<span class="brand-name-light">Hear</span></span> </a> <div class="auth-card"> <header class="auth-head"> <h1 id="rp-title">Set a new password</h1> <p id="rp-sub" class="auth-sub">Choose a new password for your account.</p> </header> <!-- Shown only once we've confirmed a valid recovery session. --> <form class="contact-form auth-form" id="rp-form" novalidate hidden> <div class="contact-field"> <label for="rp-pw">New password</label> <input id="rp-pw" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required> <ul class="pw-reqs" id="rp-reqs" aria-label="Password requirements"> <li data-rule="len">8+ characters</li> <li data-rule="upper">One uppercase letter</li> <li data-rule="lower">One lowercase letter</li> <li data-rule="num">One number</li> <li data-rule="symbol">One symbol</li> </ul> </div> <div class="contact-field"> <label for="rp-pw2">Confirm new password</label> <input id="rp-pw2" name="password2" type="password" autocomplete="new-password" placeholder="Re-enter your password" required> </div> <p class="auth-msg" id="rp-msg" role="status" hidden></p> <button type="submit" class="btn btn-orange btn-lg auth-submit" id="rp-submit">Update password</button> </form> <!-- While verifying the link, or if it is invalid/expired. --> <div id="rp-status"> <p class="auth-msg is-info" id="rp-status-msg">Verifying your reset link…</p> </div> </div> <a class="authp-back" href="/auth">&larr; Back to log in</a> </main>     <script>
      // HSP "link that just works": an approval link opens the shop with ?hsp=<token>.
      // Stash the token AS-IS (tokens are case-sensitive), strip it from the URL, then show
      // a persistent bar so the customer knows their subsidy is active while they browse.
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var t = (p.get('hsp') || '').trim();
          if (t) {
            localStorage.setItem('th_hsp', t);
            p.delete('hsp');
            var qs = p.toString();
            history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
          }
        } catch (_) {}
        try {
          // Only reassure on shopping pages (where HSP pricing is shown), not the immersive
          // audiogram test, home, about, etc.
          var pth = location.pathname;
          var onShop = pth.indexOf('/hearing-aids') === 0 || pth.indexOf('/cart') === 0;
          if (onShop && (localStorage.getItem('th_hsp') || '').trim() && !document.getElementById('thHspBar')) {
            var bar = document.createElement('div');
            bar.id = 'thHspBar';
            bar.setAttribute('role', 'status');
            bar.style.cssText = 'background:#E8F1EE;color:#224F52;border-bottom:1px solid #CFE3E3;font-family:var(--font-sans,system-ui,sans-serif);font-size:.85rem;font-weight:600;line-height:1.35;text-align:center;padding:9px 16px;';
            bar.innerHTML = '✓ Your Hearing Services Program subsidy is active. We apply it automatically at checkout, and you can add a $500 audiogram code on the payment page.';
            document.body.insertBefore(bar, document.body.firstChild);
          }
        } catch (_) {}
      })();
    </script> </body> </html> <script type="module" src="/_astro/reset-password.astro_astro_type_script_index_0_lang.xKqp5ZMt.js"></script>
